url: https://cmbeese.github.io/mizerReef/
mathjax: true
logo: man/figures/logo.png
template:
  bootstrap: 5
  # bslib:
  #   primary: "#188CA2"
  #   secondary: "#65BCBC"
  #   primary-text-emphasis: "#65BCBC"
  bootswatch: cerulean
navbar:
  #bg: primary
  structure:
    left: [home, reference, articles]
    right: [github]
home:
  sidebar:
    structure:
    - links
    - citation
    - license
    - dev
destination: docs
reference:
- title: Setting up a mizerReef model
  desc:  >
        These functions are for setting up a new mizerReef model and finding a
        steady state for the dynamical system.
- contents: has_concept("setup")
- title: Tuning a mizerReef model
  desc:  >
        These functions are for calibrating mizerReef models to match empirical
        observations.
- contents: has_concept("calibration")
- subtitle: Tuning Profiles
  desc:  >
        These refuge profiles are useful for tuning mizerReef models to steady
        state.
- contents:
    - tuning_profile
- title: Predation Refuge
  desc:  >
        These functions set up the mediation of predation with refuge.
- subtitle: Setting the refuge parameters
  desc:  >
        These functions allow users to set or change the refuge profile.
- contents: has_concept("refugeParams")
- subtitle: New Rate Functions
  desc:  >
        These functions supplement or replace mizer's default rate functions
        so that refuge impacts simulations.
- contents: has_concept("refugeRates")
- subtitle: Degradation
  desc:  >
        These functions prepare a mizer model for projections with degradation.
- contents: has_concept("degradation")
- subtitle: Plotting the refuge profile
  desc:  >
        These functions allow users visualize the refuge profile for different
        functional groups in terms of their body length.
- contents: has_concept("refugePlots")
- title: Unstructured Resources
  desc:  >
        These functions set up the production and consumption dynamics for the 
        algae and detritus resources and provide some plotting abilities to
        assess these dynamics.
- subtitle: Algae
- contents: has_concept("algae")
- subtitle: Detritus
- contents: has_concept("detritus")
- subtitle: Other Components
- contents: has_concept("Uresources")
- title: External Mortality
  desc:  >
        These functions add size-dependent senescence mortality to mizerReef 
        models.
- contents: has_concept("extmort")
- title: Summary Functions
- contents: has_concept("summary")
- title: Summary Plots
  desc:  >
        These functions calculate and plot summary statistics and allow for the
        comparison of results between different models.
- contents:
    - reef_plots
    - has_concept("sumplots")
- title: Helper Functions
- contents: has_concept("helper")
- title: Extension Mechanism
  desc:  >
        The S4 marker classes and S3 methods that let mizerReef participate in
        mizer's extension mechanism. See `vignette("extension_mechanism")` for
        details.
- contents:
    - mizerReef-class
    - getBiomass.mizerReefSim
    - upgrade.mizerReef
- title: Deprecated
- contents:
    - MizerReefParams
- title: Example Models
  desc:  >
        These files hold example parameters and mizerReef params objects for
        generic Caribbean coral reef ecosystems.
- subtitle: Simple 3-group model
  desc: >
        A simple trait-based model with three functional groups (predators,
        herbivores, invertebrates) for a generic Caribbean reef.
- contents:
    - caribbean_3_species
    - caribbean_3_interaction
    - caribbean_3_model
- subtitle: 10-group model (Karpata Reef, Bonaire)
  desc: >
        A 10-functional-group model parameterised from field data at Karpata
        Reef in Bonaire, including competitive predation refuge.
- contents:
    - caribbean_10_species
    - caribbean_10_interaction
    - caribbean_10_model
- subtitle: Empirical refuge profiles
  desc: >
        Refuge density profiles from field data, reusable across any
        mizerReef model - not tied to a particular example model.
- contents:
    - karpata_refuge
    - aquarius_refuge
- subtitle: Degradation trajectories
  desc: >
        Matrices of refuge-density scaling factors (multipliers) for three
        built-in habitat disturbance trajectories. Use with
        [setDegradation()] and [reefDegrade()].
- contents:
    - rubble_scale
    - algae_scale
    - recovery_scale
articles:
  - title: "Getting Started"
    contents:
      - mizerReef
  - title: "Tuning and Simulation"
    contents:
      - steady-state-recipe
  - title: "Model Description"
    contents:
      - karpata_model-description
      - caribbean_3_model-description
      - model-description
  - title: "Package Internals"
    contents:
      - extension_mechanism
      - multiple-resources
